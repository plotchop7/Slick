name: Unpack and Build Slick APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install p7zip and unpack
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          # Находим вообще любой архив или файл Kimi
          ARCHIVE=$(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "Kimi*" \) | head -n 1)
          echo "Processing file: $ARCHIVE"
          
          # Распаковываем через 7z прямо в текущую папку
          7z x "$ARCHIVE" -y
          
          # Если внутри папка Slick, вытаскиваем всё в корень
          if [ -d "Slick" ]; then
            echo "Moving files from Slick/ to root..."
            cp -r Slick/. .
            rm -rf Slick
          fi
          
          chmod +x gradlew
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slick-debug-apk
          path: app/build/outputs/apk/debug/*.apk
