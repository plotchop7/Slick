name: Unpack and Build Slick APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Slick Zip Archive
        run: |
          # Ищем любой zip в репозитории и распаковываем
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE"
          
          # Если файлы распаковались внутри папки Slick, поднимаем их в корень
          if [ -d "Slick" ]; then
            echo "Moving files from Slick/ to root..."
            cp -r Slick/. .
            rm -rf Slick
          fi
          
          # Даём права на запуск gradle
          chmod +x gradlew
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slick-debug-apk
          path: app/build/outputs/apk/debug/*.apk
